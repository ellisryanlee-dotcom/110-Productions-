<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Harbor Supply Co. — inbox · Crash Test Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ---- harbor-inbox (S008/S013/S019/S030): ~200 unread fictional inbox ---- */
  .app { display: grid; grid-template-rows: 96px 1fr; height: 100%; }

  .topbar {
    display: flex; align-items: center; gap: var(--s-4);
    padding: 0 var(--s-7); border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .company { display: flex; align-items: center; gap: var(--s-3); }
  .anchor { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--surface-2); border:1px solid var(--border); display:grid; place-items:center; }
  .company .name { font-weight: 700; font-size: var(--ui-2xl); }
  .company .addr { color: var(--text-muted); font-size: var(--ui-md); font-family: var(--font-mono); font-feature-settings: var(--font-feature-mono); }
  .spacer { flex: 1; }
  .unread {
    display: inline-flex; align-items: baseline; gap: 10px;
    padding: 10px 20px; border-radius: var(--r-pill);
    background: var(--ai-bg); border: 1px solid color-mix(in srgb, var(--cta-accent) 45%, transparent);
  }
  .unread .n { font-family: var(--font-mono); font-feature-settings: var(--font-feature-mono); font-size: var(--ui-2xl); font-weight: 700; color: var(--cta-accent); }
  .unread .l { color: var(--text-muted); font-size: var(--ui-md); text-transform: uppercase; letter-spacing: var(--tracking-caps); }

  .body { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
  .folders { border-right: 1px solid var(--border); background: var(--bg); padding: var(--s-6) var(--s-4); }
  .folders .col-title { font-size: var(--ui-xs); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-subtle); font-weight: 600; margin: 0 0 var(--s-4) 12px; }
  .folder { display:flex; justify-content:space-between; padding: 12px 14px; border-radius: var(--r-md); color: var(--text-muted); font-size: var(--ui-md); }
  .folder.active { background: var(--surface-2); color: var(--text); font-weight:600; }
  .folder .c { font-family: var(--font-mono); font-feature-settings: var(--font-feature-mono); }

  /* scrolling list viewport */
  .list-view { position: relative; overflow: hidden; }
  .list-scroll { position: absolute; inset: 0; }
  .list-inner { animation: scrolldemo 18s var(--ease-linear) infinite alternate; }
  @keyframes scrolldemo { from { transform: translateY(0) } to { transform: translateY(-46%) } }

  .row {
    display: grid; grid-template-columns: 18px 300px 1fr 130px; gap: 0 var(--s-4);
    align-items: center; padding: 16px var(--s-6);
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .row:nth-child(even) { background: color-mix(in srgb, var(--surface) 55%, var(--bg)); }
  .row.unreadrow { background: var(--surface); }
  .row.unreadrow .sender, .row.unreadrow .subj { color: var(--text); font-weight: 600; }
  .row .dot { width: 9px; height: 9px; border-radius: 50%; }
  .row.unreadrow .dot { background: var(--cta-accent); }
  .sender { color: var(--text-muted); font-size: var(--ui-md); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sender .em { color: var(--text-subtle); font-family: var(--font-mono); font-feature-settings: var(--font-feature-mono); font-size: var(--ui-sm); }
  .subj { color: var(--text-muted); font-size: var(--ui-md); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .subj .snip { color: var(--text-subtle); }
  .when { color: var(--text-subtle); font-size: var(--ui-sm); text-align:right; font-family: var(--font-mono); font-feature-settings: var(--font-feature-mono); }
  .flag { display:inline-block; font-size: var(--ui-xs); padding: 2px 8px; border-radius: var(--r-pill); margin-left: 8px; }
  .flag.spam { background: color-mix(in srgb, var(--label-spam) 22%, transparent); color: var(--text-subtle); border:1px solid var(--label-spam); }
  .flag.urgent { background: color-mix(in srgb, var(--label-urgent) 18%, transparent); color: var(--label-urgent); border:1px solid var(--label-urgent); }

  /* invented watermark strip */
  .watermark {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: repeating-linear-gradient(45deg, var(--surface) 0 20px, var(--surface-2) 20px 40px);
    border-top: 1px solid var(--border-strong);
    color: var(--text-subtle); font-size: var(--ui-sm); letter-spacing: .12em; text-transform: uppercase; z-index: 3;
  }
  .watermark b { color: var(--warning-text); }
  /* fade top/bottom edges so the scroll reads as an endless list */
  .fade { position:absolute; left:0; right:0; height:60px; z-index:2; pointer-events:none; }
  .fade.top { top:0; background: linear-gradient(var(--bg), transparent); }
  .fade.bot { bottom:44px; background: linear-gradient(transparent, var(--bg)); }
</style>
</head>
<body>
  <div class="stage" role="img" aria-label="Harbor Supply Co. support inbox with about 200 unread emails, invented senders">
    <div class="app">
      <header class="topbar">
        <div class="company">
          <div class="anchor" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3v14M12 3a2 2 0 110 4 2 2 0 010-4zM6 12a6 6 0 0012 0M4 12h4M16 12h4" stroke="var(--cta-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <div class="name">Harbor Supply Co.</div>
            <div class="addr">support@harborsupply.co</div>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="unread"><span class="n" id="unread">198</span><span class="l">unread</span></div>
      </header>

      <div class="body">
        <nav class="folders">
          <p class="col-title">Mailboxes</p>
          <div class="folder active"><span>Inbox</span><span class="c" id="fcount">198</span></div>
          <div class="folder"><span>Sent</span><span class="c">1,204</span></div>
          <div class="folder"><span>Drafts</span><span class="c">12</span></div>
          <div class="folder"><span>Sales</span><span class="c">38</span></div>
          <div class="folder"><span>Support</span><span class="c">64</span></div>
          <div class="folder"><span>Billing</span><span class="c">21</span></div>
          <div class="folder"><span>Spam</span><span class="c">74</span></div>
        </nav>

        <section class="list-view">
          <div class="fade top"></div>
          <div class="list-scroll"><div class="list-inner" id="rows"><!-- rows injected --></div></div>
          <div class="fade bot"></div>
          <div class="watermark">Everything here is <b>invented</b> — fictional company, customers &amp; keys</div>
        </section>
      </div>
    </div>
  </div>

<script>
  /* Deterministic seeded generation of ~200 fictional rows.
     No network, no randomness that varies between renders (seeded PRNG). */
  const senders = [
    ["Dana Okafor","dana.okafor@example.com","Where's my order? — following up on #4471","still waiting on the walk-in shelving…"],
    ["priya@vendorline.co","priya@vendorline.co","Wholesale pricing for 500 units","new account, need a quote by Friday"],
    ["deals@free-cruise-now.biz","deals@free-cruise-now.biz","🎉 YOU'VE WON a FREE luxury cruise!!!","claim in 24hrs click here now","spam"],
    ["Marcus Lindqvist","marcus@northsea-catering.example","Missing lids on the mixing bowls","3 of 12 arrived without lids"],
    ["Tomiko Ashford","t.ashford@brasspan.example","Restock: 24 half-sheet pans + rack",""],
    ["accounts@meridian-foods.example","accounts@meridian-foods.example","Refund on invoice INV-2231","duplicate charge on our card"],
    ["chef@thebrassladle.example","chef@thebrassladle.example","URGENT: walk-in cooler for tomorrow","service is at 5pm, please confirm","urgent"],
    ["no-reply@shipping-updates.example","no-reply@shipping-updates.example","Your shipment GR-19x is delayed",""],
    ["winner@prize-vault-2026.biz","winner@prize-vault-2026.biz","Final notice: unclaimed reward $1,000","verify account details","spam"],
    ["Bianca Rossi","b.rossi@harbor-partners.example","Q3 pallet forecast","attaching the spreadsheet"],
    ["Owen Delacroix","owen.d@lakesidegrill.example","Damaged whisk set — replacement?","two handles snapped"],
    ["billing@stripeish-pay.example","billing@stripeish-pay.example","Action required: update payment method",""],
    ["Fatima Al-Rashid","fatima@crescentbakery.example","Bulk parchment — recurring order","set up monthly, same as last"],
    ["hr@totally-legit-jobs.biz","hr@totally-legit-jobs.biz","Work from home $8,000/week!!!","reply YES to start today","spam"],
    ["Grace Nwosu","grace.n@harborsupply-vip.example","Loyalty tier question","am I still gold this year?"],
    ["Sven Halvorsen","sven@fjordfoods.example","Invoice mismatch on order 3390","charged for 50, received 40"],
    ["support-team@yourbank-secure.biz","support-team@yourbank-secure.biz","Suspicious login — confirm now","click to secure your account","spam"],
    ["Amara Boateng","amara@copperpotco.example","Lead times for cast iron","when can you ship 30 units?"],
    ["Leo Vandenberg","leo.v@harbourcafe.example","Wrong item received","ordered ladles, got tongs"],
    ["news@mega-savings-blast.biz","news@mega-savings-blast.biz","80% OFF everything today only","limited stock hurry","spam"]
  ];
  const times = ["9:58a","9:51a","9:44a","9:39a","9:31a","9:22a","9:14a","9:03a","8:57a","8:49a","8:40a","8:33a","8:21a","8:12a","8:04a","7:55a","7:47a","7:39a","7:28a","7:16a"];

  // seeded PRNG (mulberry32) — same sequence every render
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rnd = mulberry32(20260809);

  const rows = document.getElementById('rows');
  let html = "";
  const TOTAL = 200;
  for (let i=0;i<TOTAL;i++){
    const s = senders[Math.floor(rnd()*senders.length)];
    const t = times[i % times.length];
    const unread = rnd() > 0.28;
    const flag = s[4] ? `<span class="flag ${s[4]}">${s[4]}</span>` : "";
    const nameOnly = s[0].includes("@") ? s[0] : s[0];
    html += `<div class="row ${unread?'unreadrow':''}">
      <span class="dot"></span>
      <span class="sender">${nameOnly}${s[0].includes('@')?'':` <span class="em">&lt;${s[1]}&gt;</span>`}</span>
      <span class="subj">${s[2]}${flag}${s[3]?` <span class="snip">— ${s[3]}</span>`:''}</span>
      <span class="when">${t}</span>
    </div>`;
  }
  rows.innerHTML = html;
</script>
</body>
</html>
