<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Token / cost meter · Crash Test Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ---- token-cost-meter (S006 ticking / S037 spiking / S038 dropping) ----
       state via data-state="ticking|spiking|dropping". PERMANENT disclaimer
       strip is a non-removable layout element (⚠️VERIFY fabricated figures). */
  .stage { display: grid; grid-template-rows: 1fr 72px; }

  .scene { display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; gap: var(--s-9); padding: 0 var(--s-9); }

  .eyebrow { font-family: var(--font-sans); font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--cta-accent); font-size: var(--bcast-kicker); margin: 0 0 var(--s-4); }
  .headline { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: var(--lh-tight); margin: 0 0 var(--s-5); letter-spacing: var(--tracking-tight); }
  .subcap { color: var(--text-muted); font-size: var(--bcast-lower3-sub); margin: 0; }

  /* segmented token meter */
  .meter { margin-top: var(--s-8); }
  .meter .mlabel { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 14px; }
  .meter .mlabel .cap { font-size: var(--ui-xl); font-weight:600; color: var(--text); text-transform: uppercase; letter-spacing: var(--tracking-caps); }
  .meter .mlabel .num { font-family: var(--font-mono); font-feature-settings: var(--font-feature-mono); font-size: var(--ui-2xl); font-weight:700; color: var(--cta-accent); }

  .track {
    position: relative; height: 64px; border-radius: var(--r-md);
    background: var(--meter-track); border: 1px solid var(--border);
    overflow: hidden; display: flex; gap: 4px; padding: 6px;
  }
  /* text-chunk blocks that fill in */
  .track .seg { flex: 1; border-radius: var(--r-xs); background: color-mix(in srgb, var(--cta-accent) 22%, transparent); opacity: 0; }
  .fill {
    position:absolute; top:6px; bottom:6px; left:6px; border-radius: var(--r-sm);
    background: var(--meter-fill);
    box-shadow: 0 0 24px color-mix(in srgb, var(--cta-accent) 45%, transparent);
    width: 6%;
  }

  /* ticking: gentle climb */
  .stage[data-state="ticking"] .fill { animation: climb 1.2s var(--ease-standard) forwards; }
  @keyframes climb { from { width:6%; } to { width:46%; } }

  /* spiking: hard fast climb to near-full, fill turns red */
  .stage[data-state="spiking"] .fill { background: var(--meter-fill-spike); box-shadow: 0 0 28px color-mix(in srgb, var(--error) 55%, transparent); animation: spike 1s var(--ease-in) forwards; }
  @keyframes spike { from { width:20%; } to { width:94%; } }
  .stage[data-state="spiking"] .meter .mlabel .num { color: var(--error-text); }
  .stage[data-state="spiking"] .headline .hot { color: var(--error-text); }

  /* dropping: falls back to lean, fill turns green (hardened) */
  .stage[data-state="dropping"] .fill { background: var(--meter-fill-ok); box-shadow: 0 0 22px color-mix(in srgb, var(--success) 45%, transparent); width:94%; animation: drop 1.2s var(--ease-standard) .2s forwards; }
  @keyframes drop { from { width:94%; } to { width:24%; } }
  .stage[data-state="dropping"] .meter .mlabel .num { color: var(--success-text); }

  /* right side — wallet + running dollar figure */
  .money { text-align: center; }
  .wallet { width: 132px; height: 132px; margin: 0 auto var(--s-5); }
  .dollar {
    font-family: var(--font-mono); font-feature-settings: var(--font-feature-mono);
    font-size: 160px; font-weight: 700; line-height: 1; color: var(--cost-figure);
  }
  .stage[data-state="spiking"] .dollar { color: var(--error-text); }
  .stage[data-state="dropping"] .dollar { color: var(--success-text); }
  .money .flow { margin-top: var(--s-4); color: var(--text-muted); font-size: var(--bcast-lower3-sub); }
  .money .flow b { color: var(--warning-text); }

  /* quality micro-indicator (S038) */
  .quality { margin-top: var(--s-5); display: none; align-items:center; justify-content:center; gap:12px; color: var(--text-muted); font-size: var(--ui-xl); }
  .stage[data-state="dropping"] .quality { display: flex; }
  .quality .up { color: var(--success-text); }

  /* PERMANENT disclaimer strip — must never be removed (VERIFY flag) */
  .disclaimer-strip {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: var(--warning-bg);
    border-top: 2px solid var(--warning);
    color: var(--warning-text); font-family: var(--font-sans); font-weight: 600;
    font-size: var(--ui-xl); letter-spacing: .03em;
  }
  .disclaimer-strip svg { width: 26px; height: 26px; flex: none; }
</style>
</head>
<body>
  <!-- Change data-state to "ticking" (S006), "spiking" (S037), or "dropping" (S038). -->
  <div class="stage" id="stage" data-state="ticking" role="img"
       aria-label="Token meter and running dollar cost, illustrative figures">
    <div class="scene">
      <div class="left">
        <p class="eyebrow">Cost of a run</p>
        <h1 class="headline">Every token is <span class="hot">cash</span> out of the wallet.</h1>
        <p class="subcap">You pay for every chunk the model reads and writes.</p>

        <div class="meter">
          <div class="mlabel"><span class="cap">Tokens</span><span class="num" id="tok">0</span></div>
          <div class="track" aria-hidden="true">
            <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
            <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
            <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
            <div class="fill"></div>
          </div>
        </div>
      </div>

      <div class="money">
        <svg class="wallet" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="6" y="12" width="36" height="26" rx="4" stroke="var(--warning)" stroke-width="2.5"/>
          <path d="M6 18h30a3 3 0 013 3v0" stroke="var(--warning)" stroke-width="2.5"/>
          <circle cx="34" cy="25" r="3" fill="var(--warning)"/>
          <path d="M10 12l22-4a3 3 0 013 3v3" stroke="var(--warning)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="dollar" id="dollar">$0.00</div>
        <p class="flow">running cost — <b>illustrative</b></p>
        <div class="quality"><span>context quality</span> <span class="up">▲ sharper</span></div>
      </div>
    </div>

    <div class="disclaimer-strip">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l9 16H3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
      Illustrative — not a measured cost. Token &amp; dollar figures are fabricated demo values.
    </div>
  </div>

<script>
  /* Rolls the token count + dollar figure to match the CSS meter state.
     Numbers are deliberately stylized/illustrative per the VERIFY flag. */
  const stage = document.getElementById('stage');
  const state = new URLSearchParams(location.hash.slice(1)).get('state') || stage.dataset.state;
  stage.dataset.state = state;

  const targets = {
    ticking:  { tokens: 4200,  dollar: 0.13 },
    spiking:  { tokens: 61800, dollar: 1.94 },
    dropping: { tokens: 7300,  dollar: 0.23 }
  };
  const start = state === 'dropping' ? { tokens: 61800, dollar: 1.94 } : { tokens: 0, dollar: 0 };
  const t = targets[state] || targets.ticking;

  const tokEl = document.getElementById('tok');
  const dolEl = document.getElementById('dollar');
  const dur = 1200, t0 = performance.now();
  const fmt = n => n.toLocaleString('en-US');

  function frame(now){
    let p = Math.min(1, (now - t0) / dur);
    // step it in 6 mechanical ticks to match --ease-mech feel
    const stepped = Math.floor(p * 6) / 6;
    const tok = Math.round(start.tokens + (t.tokens - start.tokens) * stepped);
    const dol = (start.dollar + (t.dollar - start.dollar) * stepped);
    tokEl.textContent = fmt(tok);
    dolEl.textContent = '$' + dol.toFixed(2);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
