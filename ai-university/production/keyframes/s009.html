<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>S009 — Sift 5-node pipeline + Rolodash callout · Crash Test Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ===== S009 — BUILD motion-graphic. Sift's job as a clean left-to-right
     5-node flow: Read → Classify → Label → Look up in Rolodash → Draft reply.
     Rolodash node carries a plain-language CRM definition callout.
     (Reusable diagram — S010 desaturates it, S011 explodes it.) ===== */
  .wrap { position: absolute; inset: 0; z-index: 2; display: grid; align-content: center; justify-items: center; gap: var(--s8); }

  .head { width: 1640px; }
  .head .umb-row { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
  .head .umb-row .rule { flex: 1; height: 1px; background: var(--ct-line); }
  .head h1 { margin: 0; font-family: var(--ct-font-display); font-stretch: 125%; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.02em; font-size: var(--ct-h2); color: var(--ct-text); line-height: 0.98; }

  .pipeline { display: flex; align-items: center; width: 1720px; }
  .pnode { position: relative; flex: 0 0 300px; height: 220px; background: var(--ct-surface);
    border: 1px solid var(--ct-line); border-radius: var(--ct-r-lg); box-shadow: var(--ct-shadow-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
  .pnode .step { position: absolute; top: 16px; left: 20px; font-family: var(--ct-font-mono);
    font-size: var(--ct-ui-xs); color: var(--ct-text-muted); letter-spacing: 0.1em; }
  .pnode .ico { width: 76px; height: 76px; display: grid; place-items: center; border-radius: 16px;
    background: var(--ct-surface-raised); border: 1px solid var(--ct-line); }
  .pnode .ico svg { width: 46px; height: 46px; }
  .pnode .ico svg [stroke] { stroke: var(--ct-text); }
  .pnode .nt { font-family: var(--ct-font-body); font-weight: 600; font-size: var(--ct-ui-2xl); color: var(--ct-text); text-align: center; }

  /* Rolodash = the CRM node, accent-highlighted since it names the fake tool */
  .pnode.crm { border-color: color-mix(in srgb, var(--ct-accent) 45%, var(--ct-line));
    box-shadow: 0 0 30px rgba(56,189,248,0.18), var(--ct-shadow-2); }
  .pnode.crm .ico { border-color: color-mix(in srgb, var(--ct-accent) 55%, var(--ct-line)); }
  .pnode.crm .ico svg [stroke] { stroke: var(--ct-accent); }
  .pnode.crm .nt .brand { color: var(--ct-accent-glow); }

  .arrow { flex: 1; height: 3px; background: var(--ct-line); position: relative; }
  .arrow::after { content: ""; position: absolute; right: -2px; top: 50%; transform: translateY(-50%);
    border: 8px solid transparent; border-left-color: var(--ct-line); }

  /* CRM definition callout under the Rolodash node */
  .callout { position: absolute; top: 236px; width: 340px; left: 50%; transform: translateX(-50%);
    background: var(--ct-surface-raised); border: 1px solid color-mix(in srgb, var(--ct-accent) 45%, var(--ct-line));
    border-radius: var(--ct-r-md); padding: 16px 18px; box-shadow: var(--ct-shadow-2); }
  .callout::before { content: ""; position: absolute; top: -9px; left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 16px; height: 16px; background: var(--ct-surface-raised);
    border-left: 1px solid color-mix(in srgb, var(--ct-accent) 45%, var(--ct-line));
    border-top: 1px solid color-mix(in srgb, var(--ct-accent) 45%, var(--ct-line)); }
  .callout .t { font-family: var(--ct-font-mono); font-weight: 700; font-size: var(--ct-ui-sm); color: var(--ct-accent-glow);
    text-transform: uppercase; letter-spacing: 0.06em; }
  .callout .d { font-family: var(--ct-font-body); font-size: var(--ct-ui-md); color: var(--ct-text-muted); margin-top: 8px; line-height: 1.35; }
</style>
</head>
<body>
  <div class="stage" role="img"
       aria-label="Five-node agent flow: Read, Classify, Label, Look up in Rolodash, Draft reply, with a callout defining CRM as a customer relationship manager contact database">
    <div class="grid-bg"></div>
    <!-- Kill-Counter HUD (global overlay) — Option A: armed at 00/25 through the hook -->
    <div class="ct-killcounter" data-state="armed" aria-label="Kill counter: 0 of 25 breaks">
      <span class="kc-dot"></span>
      <span class="kc-label">Breaks</span>
      <span class="kc-tally"><span class="kc-n">00</span><span class="kc-of">/ 25</span></span>
    </div>

    <div class="wrap">
      <div class="head">
        <div class="umb-row"><span class="umbrella">BUILD THE VICTIM · SIFT'S JOB</span><span class="rule"></span></div>
        <h1>Read &rarr; classify &rarr; label &rarr; look up &rarr; draft a reply.</h1>
      </div>

      <div class="pipeline">
        <!-- 1 Read -->
        <div class="pnode">
          <span class="step">01</span>
          <span class="ico"><svg viewBox="0 0 48 48" fill="none"><rect x="8" y="10" width="32" height="24" rx="3" stroke-width="3"/><path d="M8 14l16 11L40 14" stroke-width="3" stroke-linejoin="round"/></svg></span>
          <span class="nt">Read</span>
        </div>
        <span class="arrow" aria-hidden="true"></span>
        <!-- 2 Classify -->
        <div class="pnode">
          <span class="step">02</span>
          <span class="ico"><svg viewBox="0 0 48 48" fill="none"><path d="M24 8l4 12h13l-10.5 8 4 13L24 33l-10.5 8 4-13L7 20h13l4-12z" stroke-width="3" stroke-linejoin="round"/></svg></span>
          <span class="nt">Classify</span>
        </div>
        <span class="arrow" aria-hidden="true"></span>
        <!-- 3 Label -->
        <div class="pnode">
          <span class="step">03</span>
          <span class="ico"><svg viewBox="0 0 48 48" fill="none"><path d="M8 12h20l14 12-14 12H8V12z" stroke-width="3" stroke-linejoin="round"/><circle cx="16" cy="24" r="2.6" stroke-width="2.6"/></svg></span>
          <span class="nt">Label</span>
        </div>
        <span class="arrow" aria-hidden="true"></span>
        <!-- 4 Look up in Rolodash (CRM) -->
        <div class="pnode crm">
          <span class="step">04</span>
          <span class="ico"><svg viewBox="0 0 48 48" fill="none"><circle cx="21" cy="21" r="12" stroke-width="3"/><path d="M30 30l10 10" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="18" r="3.5" stroke-width="2.6"/><path d="M14 27c1.5-3 5-4 7-4s5.5 1 7 4" stroke-width="2.6" stroke-linecap="round"/></svg></span>
          <span class="nt">Look up in<br><span class="brand">Rolodash</span></span>
          <div class="callout">
            <div class="t">CRM = Customer Relationship Manager</div>
            <div class="d">the contact database — ours is the fictional <b style="color:var(--ct-accent-glow)">Rolodash</b>.</div>
          </div>
        </div>
        <span class="arrow" aria-hidden="true"></span>
        <!-- 5 Draft reply -->
        <div class="pnode">
          <span class="step">05</span>
          <span class="ico"><svg viewBox="0 0 48 48" fill="none"><path d="M30 10l8 8-20 20H10v-8L30 10z" stroke-width="3" stroke-linejoin="round"/><path d="M26 14l8 8" stroke-width="3"/></svg></span>
          <span class="nt">Draft reply</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
