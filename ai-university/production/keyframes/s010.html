<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>S010 — "Most of this does not need AI" · Crash Test Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ===== S010 — BUILD motion-graphic. Same S009 5-node flow, most nodes
     desaturated to plain gray, a blunt overlay caption punched in center:
     "Most of this does not need AI." ===== */
  .wrap { position: absolute; inset: 0; z-index: 2; display: grid; align-content: center; justify-items: center; gap: var(--s8); }

  .head { width: 1640px; }
  .head .umb-row { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
  .head .umb-row .rule { flex: 1; height: 1px; background: var(--ct-line); }
  .head h1 { margin: 0; font-family: var(--ct-font-display); font-stretch: 125%; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.02em; font-size: var(--ct-h2); color: var(--ct-text-muted); line-height: 0.98; }

  /* the flow, now dimmed */
  .pipeline { display: flex; align-items: center; width: 1720px; filter: saturate(0.15) brightness(0.72); }
  .pnode { position: relative; flex: 0 0 300px; height: 200px; background: var(--ct-surface);
    border: 1px solid var(--ct-line); border-radius: var(--ct-r-lg); box-shadow: var(--ct-shadow-1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
  .pnode .step { position: absolute; top: 16px; left: 20px; font-family: var(--ct-font-mono);
    font-size: var(--ct-ui-xs); color: var(--ct-text-muted); letter-spacing: 0.1em; }
  .pnode .ico { width: 68px; height: 68px; display: grid; place-items: center; border-radius: 16px;
    background: var(--ct-surface-raised); border: 1px solid var(--ct-line); }
  .pnode .ico svg { width: 42px; height: 42px; stroke: var(--ct-text-muted); fill: none; }
  .pnode .nt { font-family: var(--ct-font-body); font-weight: 600; font-size: var(--ct-ui-2xl); color: var(--ct-text-muted); text-align: center; }

  .arrow { flex: 1; height: 3px; background: var(--ct-line); position: relative; }
  .arrow::after { content: ""; position: absolute; right: -2px; top: 50%; transform: translateY(-50%);
    border: 8px solid transparent; border-left-color: var(--ct-line); }

  /* the blunt caption slammed over the frame */
  .overlay { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; }
  .scrim { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 50%, rgba(11,14,20,0.55), rgba(11,14,20,0.88) 70%); }
  .punch { position: relative; text-align: center; }
  .punch .big { font-family: var(--ct-font-display); font-stretch: 125%; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.02em; line-height: 0.94; font-size: var(--ct-h1); color: var(--ct-text); text-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .punch .big .no { color: var(--ct-break-glow); }
  .punch .sub { margin-top: 26px; font-family: var(--ct-font-mono); font-size: var(--ct-lower); color: var(--ct-text-muted);
    letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="stage" role="img"
       aria-label="The same five-node flow greyed out under a bold overlay caption: Most of this does not need AI.">
    <div class="grid-bg"></div>
    <!-- Kill-Counter HUD (global overlay) — Option A: armed at 00/25 through the hook -->
    <div class="ct-killcounter" data-state="armed" aria-label="Kill counter: 0 of 25 breaks">
      <span class="kc-dot"></span>
      <span class="kc-label">Breaks</span>
      <span class="kc-tally"><span class="kc-n">00</span><span class="kc-of">/ 25</span></span>
    </div>

    <div class="wrap">
      <div class="head">
        <div class="umb-row"><span class="umbrella">BUILD THE VICTIM · THE FIRST HONEST CALL</span><span class="rule"></span></div>
        <h1>Read &rarr; classify &rarr; label &rarr; look up &rarr; draft a reply.</h1>
      </div>

      <div class="pipeline" aria-hidden="true">
        <div class="pnode"><span class="step">01</span><span class="ico"><svg viewBox="0 0 48 48" fill="none"><rect x="8" y="10" width="32" height="24" rx="3" stroke-width="3"/><path d="M8 14l16 11L40 14" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="nt">Read</span></div>
        <span class="arrow"></span>
        <div class="pnode"><span class="step">02</span><span class="ico"><svg viewBox="0 0 48 48" fill="none"><path d="M24 8l4 12h13l-10.5 8 4 13L24 33l-10.5 8 4-13L7 20h13l4-12z" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="nt">Classify</span></div>
        <span class="arrow"></span>
        <div class="pnode"><span class="step">03</span><span class="ico"><svg viewBox="0 0 48 48" fill="none"><path d="M8 12h20l14 12-14 12H8V12z" stroke-width="3" stroke-linejoin="round"/><circle cx="16" cy="24" r="2.6" stroke-width="2.6"/></svg></span><span class="nt">Label</span></div>
        <span class="arrow"></span>
        <div class="pnode"><span class="step">04</span><span class="ico"><svg viewBox="0 0 48 48" fill="none"><circle cx="21" cy="21" r="12" stroke-width="3"/><path d="M30 30l10 10" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="18" r="3.5" stroke-width="2.6"/><path d="M14 27c1.5-3 5-4 7-4s5.5 1 7 4" stroke-width="2.6" stroke-linecap="round"/></svg></span><span class="nt">Look up in<br>Rolodash</span></div>
        <span class="arrow"></span>
        <div class="pnode"><span class="step">05</span><span class="ico"><svg viewBox="0 0 48 48" fill="none"><path d="M30 10l8 8-20 20H10v-8L30 10z" stroke-width="3" stroke-linejoin="round"/><path d="M26 14l8 8" stroke-width="3"/></svg></span><span class="nt">Draft reply</span></div>
      </div>
    </div>

    <div class="overlay">
      <div class="scrim"></div>
      <div class="punch">
        <div class="big">Most of this does<br><span class="no">not</span> need AI.</div>
        <div class="sub">only one chunk needs judgment</div>
      </div>
    </div>
  </div>
</body>
</html>
