<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>S012 — Empty system prompt → ROUND 1 slate · Crash Test Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ===== S012 — BUILD title-card. Empty "System prompt" document lead-in
     (blank placeholder lines) resolving into the reusable ROUND 1 slate
     (bible §7.2). Rested state = the ROUND 1 slate over the ghosted empty doc. ===== */

  /* --- ghosted empty System-prompt document behind the slate (the lead-in) --- */
  .ghost { position: absolute; inset: 0; z-index: 0; display: grid; place-items: center;
    filter: blur(2px) brightness(0.7); }
  .doc { width: 980px; background: var(--ct-surface); border: 1px solid var(--ct-line);
    border-radius: var(--ct-r-lg); box-shadow: var(--ct-shadow-2); overflow: hidden; }
  .doc .bar { display: flex; align-items: center; gap: 12px; padding: 16px 22px;
    background: var(--ct-surface-raised); border-bottom: 1px solid var(--ct-line); }
  .doc .bar .g { width: 26px; height: 26px; border-radius: 7px; background: var(--ct-bg); border: 1px solid var(--ct-line);
    display: grid; place-items: center; }
  .doc .bar .g svg { width: 16px; height: 16px; }
  .doc .bar .t { font-family: var(--ct-font-mono); font-size: var(--ct-ui-md); color: var(--ct-text); }
  .doc .bar .empty { margin-left: auto; font-family: var(--ct-font-mono); font-size: var(--ct-ui-xs); color: var(--ct-text-muted);
    text-transform: uppercase; letter-spacing: 0.1em; }
  .doc .body { padding: 30px 34px 40px; display: flex; flex-direction: column; gap: 20px; }
  .doc .line { height: 16px; border-radius: 5px; background: var(--ct-surface-raised); }
  .doc .line.w1 { width: 40%; } .doc .line.w2 { width: 72%; } .doc .line.w3 { width: 55%; }
  .doc .line.w4 { width: 84%; } .doc .line.w5 { width: 30%; }

  /* --- dark scrim so the slate reads cleanly (bible §4.3 / §7.1 pattern) --- */
  .scrim { position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(120% 90% at 50% 50%, rgba(11,14,20,0.72) 0%, rgba(11,14,20,0.93) 60%, rgba(5,7,12,0.98) 100%); }

  /* --- ROUND 1 slate (reusable §7.2 template) --- */
  .slate { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; }
  .slate-inner { text-align: center; }
  .slate .kicker { font-family: var(--ct-font-mono); text-transform: uppercase; letter-spacing: 0.16em;
    font-size: var(--ct-lower); color: var(--ct-text-muted); }
  .slate .round { display: flex; align-items: stretch; justify-content: center; gap: 30px; margin: 30px 0 24px; }
  .slate .spine { width: 12px; border-radius: 2px; flex: 0 0 12px;
    background: linear-gradient(to bottom, var(--ct-break) 0 50%, var(--ct-fixed) 50% 100%);
    box-shadow: 0 0 26px rgba(255,59,48,0.35), 0 0 26px rgba(43,213,118,0.30); }
  .slate .round .lab { font-family: var(--ct-font-display); font-stretch: 125%; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.03em; line-height: 0.9; font-size: 190px; color: var(--ct-text); }
  .slate .sub { font-family: var(--ct-font-body); font-weight: 500; font-size: var(--ct-h3); color: var(--ct-text-muted); }
  .slate .rulebar { width: 640px; height: 1px; background: var(--ct-line); margin: 40px auto 0; }
</style>
</head>
<body>
  <div class="stage" role="img"
       aria-label="An empty System prompt document behind a bold ROUND 1 slate: bad inputs and the wrong tool for the job">
    <div class="grid-bg"></div>
    <!-- Kill-Counter HUD (global overlay) — Option A: armed at 00/25 through the hook -->
    <div class="ct-killcounter" data-state="armed" aria-label="Kill counter: 0 of 25 breaks">
      <span class="kc-dot"></span>
      <span class="kc-label">Breaks</span>
      <span class="kc-tally"><span class="kc-n">00</span><span class="kc-of">/ 25</span></span>
    </div>

    <div class="ghost" aria-hidden="true">
      <div class="doc">
        <div class="bar">
          <span class="g"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4h7l4 4v12H7z" stroke="var(--ct-text-muted)" stroke-width="2" stroke-linejoin="round"/><path d="M14 4v4h4" stroke="var(--ct-text-muted)" stroke-width="2" stroke-linejoin="round"/></svg></span>
          <span class="t">System prompt</span>
          <span class="empty">empty · no help at all</span>
        </div>
        <div class="body">
          <span class="line w1"></span><span class="line w2"></span><span class="line w3"></span>
          <span class="line w4"></span><span class="line w5"></span><span class="line w2"></span>
        </div>
      </div>
    </div>

    <div class="scrim"></div>

    <div class="slate">
      <div class="slate-inner">
        <div class="kicker">give Sift no help at all &mdash; watch it fail</div>
        <div class="round">
          <span class="spine" aria-hidden="true"></span>
          <span class="lab">Round&nbsp;1</span>
        </div>
        <div class="sub">Bad inputs and the wrong tool for the job</div>
        <div class="rulebar" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</body>
</html>
